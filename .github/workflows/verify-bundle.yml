name: Verify UnityPlugin bundle

# Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js 是整体替换的 minified 构建产物，
# 曾在 release 环境触发 e.downloadWasm 启动异常。这里确保结构守卫会自动执行，
# 避免后续替换 bundle 时修复被静默覆盖。

on:
  pull_request:
    paths:
      - 'Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
      - 'verify-unityplugin-bundle.mjs'
      - '.github/workflows/verify-bundle.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
      - 'verify-unityplugin-bundle.mjs'
      - '.github/workflows/verify-bundle.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 固定到 commit SHA，避免 action 的可变 tag 被重新指向后执行不同代码
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: 检测本次是否改动了 bundle 与 CHANGELOG
        id: detect
        shell: bash
        run: |
          # 说明：bundle 的硬门禁是内容 sha256（见 verify-unityplugin-bundle.mjs），
          # 这里只负责回答“本次变更范围里是否出现过 bundle / CHANGELOG”。
          # 范围一旦无法确定，就按“有变更”处理（changed=true）：宁可多要求一次
          # CHANGELOG 记录，也不要在不确定时静默放行。任何情况下都不 fail 掉整个
          # workflow —— 内容门禁是独立且恒定的，不该被范围推断的问题连坐。
          set -uo pipefail

          bundle='Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
          changelog='CHANGELOG.md'
          event='${{ github.event_name }}'
          changed_files=''
          determinate='true'

          # 返回 0 表示成功，结果写在 RESULT 里；1 表示范围不可达。
          # 不用命令替换的 $? 判断，避免子 shell 状态带来的歧义。
          RESULT=''
          try_range() {
            local old="$1" new="$2"
            RESULT=''
            git rev-parse --verify --quiet "${old}^{commit}" >/dev/null || return 1
            git rev-parse --verify --quiet "${new}^{commit}" >/dev/null || return 1
            RESULT=$(git diff --name-only "$old" "$new") || return 1
            return 0
          }

          if [ "$event" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
            if try_range "$base" 'HEAD'; then
              changed_files="$RESULT"
            else
              # base 不可达时退回与目标分支的合并基点
              git fetch --quiet origin '${{ github.base_ref }}' || true
              if try_range 'FETCH_HEAD' 'HEAD'; then
                changed_files="$RESULT"
              else
                determinate='false'
              fi
            fi
          elif [ "$event" = 'push' ]; then
            before='${{ github.event.before }}'
            after='${{ github.event.after }}'
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -qE '^0+$'; then
              # 常规推送：推送前后的完整范围。
              # 若 before 已不可达（历史被改写），不退回 after^..after —— 那只能覆盖
              # 末次提交，会漏掉同一批推送里更早提交对 bundle 的改动，正是漏检的来源；
              # 这种情况下直接判为不确定，走保守分支。
              if try_range "$before" "$after"; then
                changed_files="$RESULT"
              else
                determinate='false'
              fi
            else
              # 新建分支：before 为全 0，after^..after 即该次推送的提交范围
              if try_range "${after}^" "$after"; then
                changed_files="$RESULT"
              else
                determinate='false'
              fi
            fi
          fi
          # 其他事件（如手工触发）没有可比对的范围：同样按“有变更”处理

          changed='false'
          changelog_changed='false'
          if [ "$determinate" = 'true' ] && [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | grep -qx "$bundle" && changed='true' || true
            printf '%s\n' "$changed_files" | grep -qx "$changelog" && changelog_changed='true' || true
          else
            changed='true'
            echo "::notice::本次未能确定变更范围，按“有变更”处理，要求同批变更包含 CHANGELOG 更新"
          fi

          {
            echo "changed=$changed"
            echo "changelog_changed=$changelog_changed"
          } >> "$GITHUB_OUTPUT"
          echo "event: $event"
          echo "determinate: $determinate"
          echo "bundle changed: $changed / changelog changed: $changelog_changed"

      - name: 运行 bundle 结构守卫
        env:
          BUNDLE_CHANGED: ${{ steps.detect.outputs.changed }}
          CHANGELOG_CHANGED: ${{ steps.detect.outputs.changelog_changed }}
        run: node verify-unityplugin-bundle.mjs
