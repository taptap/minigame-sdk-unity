name: Verify UnityPlugin bundle

# Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js 是整体替换的 minified 构建产物，
# 曾在 release 环境触发 e.downloadWasm 启动异常。这里确保结构守卫会自动执行，
# 避免后续替换 bundle 时修复被静默覆盖。

on:
  pull_request:
    paths:
      - 'Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
      - 'verify-unityplugin-bundle.mjs'
      - '.github/workflows/verify-bundle.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
      - 'verify-unityplugin-bundle.mjs'
      - '.github/workflows/verify-bundle.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 固定到 commit SHA，避免 action 的可变 tag 被重新指向后执行不同代码
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: 检测本次是否改动了 bundle 与 CHANGELOG
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          bundle='Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
          changelog='CHANGELOG.md'

          # 按事件类型确定本次变更范围：pull_request 用 base..HEAD，
          # push 用 before..after（直接推送同样要能检出，否则会跳过 CHANGELOG 核对）。
          changed_files=''
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
            if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
              changed_files=$(git diff --name-only "$base" HEAD)
            fi
          elif [ "${{ github.event_name }}" = 'push' ]; then
            before='${{ github.event.before }}'
            after='${{ github.event.after }}'
            # 新建分支时 before 为全 0，此时退化为只看该 commit 自身
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -qE '^0+$'; then
              changed_files=$(git diff --name-only "$before" "$after")
            else
              changed_files=$(git show --name-only --pretty=format: "$after")
            fi
          fi

          changed='false'
          changelog_changed='false'
          if [ -n "$changed_files" ]; then
            echo "$changed_files" | grep -qx "$bundle" && changed='true' || true
            echo "$changed_files" | grep -qx "$changelog" && changelog_changed='true' || true
          fi

          {
            echo "changed=$changed"
            echo "changelog_changed=$changelog_changed"
          } >> "$GITHUB_OUTPUT"
          echo "event: ${{ github.event_name }}"
          echo "bundle changed: $changed / changelog changed: $changelog_changed"

      - name: 运行 bundle 结构守卫
        env:
          BUNDLE_CHANGED: ${{ steps.detect.outputs.changed }}
          CHANGELOG_CHANGED: ${{ steps.detect.outputs.changelog_changed }}
        run: node verify-unityplugin-bundle.mjs
