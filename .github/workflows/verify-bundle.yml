name: Verify UnityPlugin bundle

# Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js 是整体替换的 minified 构建产物，
# 曾在 release 环境触发 e.downloadWasm 启动异常。这里确保结构守卫会自动执行，
# 避免后续替换 bundle 时修复被静默覆盖。

on:
  pull_request:
    paths:
      - 'Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
      - 'verify-unityplugin-bundle.mjs'
      - '.github/workflows/verify-bundle.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
      - 'verify-unityplugin-bundle.mjs'
      - '.github/workflows/verify-bundle.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 固定到 commit SHA，避免 action 的可变 tag 被重新指向后执行不同代码
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: 检测本次是否改动了 bundle 与 CHANGELOG
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          bundle='Runtime/minigame-default/cachedPlugin/UnityPlugin/index.js'
          changelog='CHANGELOG.md'
          changed='false'
          changelog_changed='false'
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
            changed_files=$(git diff --name-only "$base" HEAD)
            if echo "$changed_files" | grep -qx "$bundle"; then
              changed='true'
            fi
            if echo "$changed_files" | grep -qx "$changelog"; then
              changelog_changed='true'
            fi
          fi
          {
            echo "changed=$changed"
            echo "changelog_changed=$changelog_changed"
          } >> "$GITHUB_OUTPUT"
          echo "bundle changed: $changed / changelog changed: $changelog_changed"

      - name: 运行 bundle 结构守卫
        env:
          BUNDLE_CHANGED: ${{ steps.detect.outputs.changed }}
          CHANGELOG_CHANGED: ${{ steps.detect.outputs.changelog_changed }}
        run: node verify-unityplugin-bundle.mjs
